# 공개 사이트 저장소로 배포 (2026-11-04 주인 결정 — 원본 저장소는 비공개로 돌리고, 공개되는 것은 완성된 사이트 파일뿐이다).
# 원본 저장소(이 저장소)가 비공개가 되면 무료 요금제에서는 이 저장소의 Pages 가 내려간다. 같은 주소
# https://vetnam555-del.github.io/kim-seonil-portfolio/ 는 공개 저장소 vetnam555-del.github.io 의 kim-seonil-portfolio/ 폴더가 이어서 낸다
# (사용자 사이트는 프로젝트 사이트가 없는 경로를 맡는다). 이미 제출한 이력서 · 프로필 링크는 그대로 열린다.
# 설정(주인 · 한 번): Actions 변수 PUBLIC_SITE_REPO = vetnam555-del/vetnam555-del.github.io
#                    Actions 비밀값 PUBLIC_SITE_TOKEN = 그 저장소 하나에 Contents 읽기·쓰기만 준 fine-grained 토큰.
# 변수가 비어 있으면 아무것도 하지 않는다 — 설정 전에 main 에 들어가도 실패하지 않는다.
name: Publish public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-public
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.PUBLIC_SITE_REPO != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pages.yml 과 같은 선택 — 빌드 결과만, 원본 · 작업 메모는 빼고
      - name: Collect build output only
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          tar -cf - \
            --exclude=./.git --exclude=./.github --exclude=./.claude --exclude=./source \
            --exclude=./AGENTS.md --exclude=./CLAUDE.md --exclude=./README.md --exclude=./.gitignore --exclude=./.gitattributes \
            . | tar -xf - -C "$site"
          test -f "$site/index.html"
          for p in source .claude .github AGENTS.md CLAUDE.md README.md; do
            if [ -e "$site/$p" ]; then echo "::error::$p must not be published"; exit 1; fi
          done
          if find "$site" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.py' -o -name '*.md' \) | grep -q .; then
            echo "::error::source-like files found in the site artifact"
            find "$site" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.py' -o -name '*.md' \) | head -20
            exit 1
          fi
          echo "files: $(find "$site" -type f | wc -l)"

      - name: Push to the public site repository
        env:
          TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
          REPO: ${{ vars.PUBLIC_SITE_REPO }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then echo "::error::PUBLIC_SITE_TOKEN is not set"; exit 1; fi
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          pub="$RUNNER_TEMP/public"
          if ! git clone --quiet --depth 1 "$url" "$pub" 2>/dev/null; then
            # 비어 있는 새 저장소는 clone 할 브랜치가 없다 — 처음 한 번은 새로 만든다
            mkdir -p "$pub" && git -C "$pub" init -q -b main && git -C "$pub" remote add origin "$url"
          fi
          # 포트폴리오 폴더만 통째로 바꾼다
          rm -rf "$pub/kim-seonil-portfolio"
          mkdir -p "$pub/kim-seonil-portfolio"
          cp -a "$RUNNER_TEMP/site/." "$pub/kim-seonil-portfolio/"
          # 사용자 사이트 뿌리: Jekyll 끄기(_next 폴더를 지우지 않게), 짧은 주소 → 포트폴리오, 없는 주소는 포트폴리오의 404,
          # 검색 로봇이 읽는 자리(호스트 뿌리)의 robots.txt
          touch "$pub/.nojekyll"
          cp "$GITHUB_WORKSPACE/.github/public-site/index.html" "$pub/index.html"
          cp "$RUNNER_TEMP/site/404.html" "$pub/404.html"
          cp "$RUNNER_TEMP/site/robots.txt" "$pub/robots.txt"
          cd "$pub"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="portfolio-publisher" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish site"
          git push -q origin HEAD:main
          echo "published $(find kim-seonil-portfolio -type f | wc -l) files"
