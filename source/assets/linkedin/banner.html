<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  링크드인 배경 사진 (2026.10.31). 1584×396 을 2배로 굽는다 — node scripts/render_linkedin_banner.cjs [a|b]
  a: 포트폴리오 공유 이미지(og-image)와 같은 글꼴 · 색 · 문구. b: 같은 문구를 Higgsfield 로 만든 배경(hf-bg.png) 위에.
  왼쪽 아래는 링크드인 프로필 사진이 덮는 자리라 글자는 x=520 오른쪽에만 둔다.
-->
<style>
  @font-face { font-family: "Archivo"; src: url("../../public/fonts/original/Archivo-Var.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Pretendard"; src: url("../../public/fonts/original/Pretendard-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Pretendard"; src: url("../../public/fonts/original/Pretendard-SemiBold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Pretendard"; src: url("../../public/fonts/original/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body {
    background: #0b0d10; color: #f2efe8; font-family: "Pretendard", sans-serif;
    position: relative;
  }
  /* LinkedIn puts the profile photo over the lower left; everything readable sits right of x=520. */
  .copy { position: absolute; left: 520px; right: 72px; top: 50%; transform: translateY(-50%); display: grid; gap: 14px; }
  .eyebrow { font-family: "Archivo", "Pretendard", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .14em; color: #a8b0ba; text-transform: uppercase; }
  .eyebrow b { color: #ff5a3d; font-weight: 600; }
  h1 { font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 800; font-size: 68px; line-height: 1; letter-spacing: -.01em; white-space: nowrap; }
  h1 em { font-style: normal; color: #ff5a3d; }
  .line { font-weight: 700; font-size: 27px; letter-spacing: -.02em; }
  .foot { margin-top: 6px; display: flex; gap: 18px; align-items: baseline; font-size: 17px; color: #a8b0ba; white-space: nowrap; }
  .foot .url { font-family: "Archivo", sans-serif; font-stretch: 100%; letter-spacing: .02em; color: #f2efe8; }
  body.hf { background: #181016 url("hf-bg.png") no-repeat 0 -282px / 1584px auto; }
  .rule { position: absolute; left: 520px; right: 72px; bottom: 34px; height: 1px; background: #2c343f; }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">Kim Seonill — Performance Marketer <b>· Portfolio 2026</b></p>
    <h1>FIND. TEST. <em>IMPROVE.</em></h1>
    <p class="line">문제를 구조화해 가설을 세우고, 테스트로 개선합니다.</p>
    <p class="foot"><span>검색·DA·SNS 4년 · 30여 개 브랜드</span><span class="url">vetnam555-del.github.io/kim-seonil-portfolio</span></p>
  </div>
  <script>if (location.search === "?b") document.body.classList.add("hf");</script>
</body>
</html>
